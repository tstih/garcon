# Default development router module.
# Richer router (lexically 04, before rate-limit) with path param support.
# Captures from {name} patterns are injected only on `pass` as
# X-Garcon-Route-Param-Name headers (e.g. {id} -> X-Garcon-Route-Param-Id)
# so later modules can use them. Health routes use direct respond.
path=../modules/libgarcon_router_module.so
route=GET|/healthz|respond|200|text/plain; charset=utf-8|ok
route=GET|/readyz|respond|200|text/plain; charset=utf-8|ready
route=GET|/api/{version}/*|pass
route=GET|/users/{id}|pass
