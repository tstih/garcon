# Example JWT auth module.
# Loaded after 08-header-guard.conf due to lexical 09- prefix (before static-files).
# Uses rule scoping so it only enforces on selected paths (here /jwt/*) and does
# not interfere with default demo paths like /api/* (still guarded by header-guard
# + rate-limit in the example chain).
path=../modules/libgarcon_jwt_auth_module.so
secret=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
alg=HS256
# issuer=garcon
# audience=api
rule=*|/jwt/*
